; M5Stack CoreS3 body firmware for embodied-claude (develop_v0).
; The body dials out to m5-link on the desktop over WebSocket; see
; docs/m5-body-protocol.ja.md for the messages.
;
; Library versions are pinned: this runs unattended for days, and a library
; bump between builds should be a decision, not an accident. M5Unified and M5GFX
; are a pair released on the same day (2026-10-20). The M5CoreS3 library is not
; used: it pulls an unpinned M5GFX, and all we need from it is the camera pin
; map (src/body_camera.cpp) and the LTR553 driver (src/vendor/, MIT).
;
; Do not run `pio pkg install/uninstall -l ...` against this file: it rewrites
; lib_deps and drops these comments.

[env:cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.2.27
    m5stack/M5GFX@0.2.34
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.4.2
