<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m5-link</title>
<style>
  :root {
    --bg: #f6f7f5; --panel: #ffffff; --ink: #24302c; --muted: #6b7772; --line: #dfe4e1;
    --accent: #3e6a8a; --ok: #3a7d4f; --warn: #b8752e; --bad: #b23b3b; --human: #eef3f8; --head: #f1f6ef;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px;
         grid-template-columns: minmax(0, 1fr) 300px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0; grid-column: 1 / -1; display: flex; gap: 10px; align-items: baseline; }
  h1 small { font-size: 13px; color: var(--muted); font-weight: normal; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  h2 { font-size: 13px; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #eceff0; color: var(--muted); }
  .pill.ok { background: #e3f1e7; color: var(--ok); } .pill.warn { background: #f7ecdf; color: var(--warn); }
  .pill.bad { background: #f6e3e3; color: var(--bad); }
  .desire { display: grid; grid-template-columns: 9em 1fr 3em; gap: 8px; align-items: center; font-size: 14px; margin: 6px 0; }
  .desire .bar { height: 8px; border-radius: 999px; background: #eceff0; overflow: hidden; }
  .desire .bar span { display: block; height: 100%; background: var(--accent); }
  .desire.strong .bar span { background: var(--warn); }
  .desire .value { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  #log { height: 52vh; min-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .line { max-width: 85%; padding: 8px 11px; border-radius: 10px; line-height: 1.55; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .line.human { align-self: flex-end; background: var(--human); }
  .line.head { align-self: flex-start; background: var(--head); }
  .line.system { align-self: center; color: var(--muted); font-size: 13px; }
  .meta { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text] { flex: 1; min-width: 0; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  button { font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .moods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
  #events { font-size: 12px; color: var(--muted); max-height: 160px; overflow-y: auto; margin: 0; padding-left: 16px; }
  #photo { width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  .stack { display: grid; gap: 16px; align-content: start; }
</style>
</head>
<body>
<main>
  <h1>m5-link <small id="subtitle">体と頭をつなぐところ</small></h1>

  <section>
    <h2>会話</h2>
    <div class="pills" id="pills"></div>
    <div id="log" aria-live="polite"></div>
    <form id="chat">
      <input type="text" id="message" placeholder="体に話しかける（文字）" autocomplete="off">
      <button class="primary" id="send">送る</button>
    </form>
  </section>

  <div class="stack">
    <section>
      <h2>体</h2>
      <dl id="body"></dl>
    </section>
    <section>
      <h2>顔</h2>
      <div class="moods" id="moods"></div>
    </section>
    <section>
      <h2>目</h2>
      <button id="snapshot">いま撮る</button>
      <p id="photo-error" class="meta" hidden></p>
      <img id="photo" alt="" hidden>
    </section>
    <section>
      <h2>頭</h2>
      <dl id="head"></dl>
    </section>
    <section>
      <h2>欲求</h2>
      <div id="desires"></div>
      <p class="meta">記憶（最後にそれをしてから何時間か）と体の状態から 5 分ごとに計算。0.6 を超えると定期起床に伝わる。</p>
    </section>
    <section>
      <h2>最近の出来事</h2>
      <p class="meta">頭がまだ読んでいない体の記録</p>
      <pre id="notes" class="meta"></pre>
      <ul id="events"></ul>
    </section>
    <section>
      <h2>定期起床</h2>
      <dl id="heartbeat"></dl>
      <p><button id="beat">いま起こす</button></p>
    </section>
  </div>
</main>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
const headers = {"Content-Type": "application/json", "X-Link-Token": token};
const moods = [["happy","にこ"],["sad","しょぼん"],["surprised","びっくり"],["thinking","考え中"],
               ["sleepy","ねむい"],["love","すき"],["neutral","ふつう"]];
let shownLines = 0;

async function api(path, body) {
  const response = await fetch(path + (token ? `?token=${encodeURIComponent(token)}` : ""),
    body === undefined ? {headers} : {method: "POST", headers, body: JSON.stringify(body)});
  return response.json();
}

function pill(text, kind) {
  const span = document.createElement("span");
  span.className = `pill ${kind || ""}`;
  span.textContent = text;
  return span;
}

function timeOf(seconds) {
  return new Date(seconds * 1000).toLocaleTimeString("ja-JP", {hour: "2-digit", minute: "2-digit", second: "2-digit"});
}

function fillList(element, pairs) {
  element.replaceChildren(...pairs.flatMap(([key, value]) => {
    const dt = document.createElement("dt"); dt.textContent = key;
    const dd = document.createElement("dd"); dd.textContent = value ?? "—";
    return [dt, dd];
  }));
}

function renderLog(lines) {
  const log = document.getElementById("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  if (lines.length < shownLines) { log.replaceChildren(); shownLines = 0; }
  for (const line of lines.slice(shownLines)) {
    const div = document.createElement("div");
    div.className = `line ${line.who}`;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [timeOf(line.at), line.source, line.mood].filter(Boolean).join(" · ");
    div.append(meta, document.createTextNode(line.text));
    log.append(div);
  }
  shownLines = lines.length;
  if (atBottom) log.scrollTop = log.scrollHeight;
}

async function refresh() {
  let status;
  try { status = await api("/api/status"); } catch { return; }
  const body = status.body, state = body.state || {};
  document.getElementById("pills").replaceChildren(
    pill(body.connected ? "体：つながっている" : "体：いない", body.connected ? "ok" : "bad"),
    pill(status.head.ready ? (status.head.thinking ? "頭：考え中" : "頭：起きている") : "頭：起きる途中",
         status.head.ready ? "ok" : "warn"),
    pill(`耳：${status.ears.model || "準備中"} ${status.ears.device}`, status.ears.model ? "ok" : "warn"),
    pill(`口：${status.mouth.ready ? status.mouth.voice : "準備中"}`, status.mouth.ready ? "ok" : "warn"),
    ...(status.head.mcp || []).filter(s => s.status !== "connected")
      .map(s => pill(`MCP ${s.name}：${s.status}`, "bad")),
  );
  fillList(document.getElementById("body"), [
    ["名前", body.hello.name], ["ファーム", body.hello.fw],
    ["電池", state.battery !== undefined ? `${state.battery}%${state.charging ? "（充電中）" : ""}` : null],
    ["Wi-Fi", state.ssid ? `${state.ssid} (${state.rssi} dBm)` : null],
    ["近く", state.near === undefined ? null : (state.near ? "何かいる" : "いない")],
    ["明るさ", state.light], ["話し中", body.speaking ? "はい" : "いいえ"],
  ]);
  const head = status.head;
  const mcpText = (head.mcp || []).map(s => s.status === "connected" ? `${s.name} ${s.tools}` : `${s.name} ✕ ${s.status}`).join("、");
  fillList(document.getElementById("head"), [
    ["版", status.version], ["モデル", head.model],
    ["今日のセッション", head.day ? `${head.day}（返事 ${head.replies} 回）` : null],
    ["文脈", head.context_tokens != null ? `${Math.round(head.context_tokens / 1000)}k トークン（起動時）` : null],
    ["MCP", mcpText || null],
  ]);
  document.getElementById("notes").textContent = status.body_notes_unread || "（なし）";
  const desires = status.desires || [];
  document.getElementById("desires").replaceChildren(...(desires.length ? desires.map(d => {
    const row = document.createElement("div");
    row.className = `desire${d.level >= 0.6 ? " strong" : ""}`;
    const label = document.createElement("span"); label.textContent = d.label;
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("span"); fill.style.width = `${Math.round(d.level * 100)}%`;
    bar.append(fill);
    const value = document.createElement("span"); value.className = "value"; value.textContent = d.level.toFixed(2);
    row.append(label, bar, value);
    return row;
  }) : [Object.assign(document.createElement("p"), {className: "meta", textContent: "まだ計算していない"})]));
  document.getElementById("events").replaceChildren(...body.recent_events.slice().reverse().map(e => {
    const li = document.createElement("li"); li.textContent = `${timeOf(e.at)} ${e.kind}`; return li;
  }));
  const hb = status.heartbeat;
  fillList(document.getElementById("heartbeat"), [
    ["状態", hb.enabled ? (hb.running ? "起きている" : "待機") : "止めてある"],
    ["次", hb.next ? new Date(hb.next).toLocaleTimeString("ja-JP", {hour: "2-digit", minute: "2-digit"}) : null],
    ["前回", hb.last_started ? new Date(hb.last_started).toLocaleString("ja-JP") : null],
  ]);
  renderLog(status.conversation);
}

document.getElementById("chat").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = document.getElementById("message");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  document.getElementById("send").disabled = true;
  try { await api("/api/chat", {text}); } finally { document.getElementById("send").disabled = false; refresh(); }
});

document.getElementById("moods").replaceChildren(...moods.map(([mood, label]) => {
  const button = document.createElement("button");
  button.textContent = label;
  button.addEventListener("click", () => api("/api/face", {mood, ms: 5000}));
  return button;
}));

document.getElementById("snapshot").addEventListener("click", async () => {
  const result = await api("/api/snapshot", {});
  const photo = document.getElementById("photo");
  const error = document.getElementById("photo-error");
  error.hidden = Boolean(result.path);
  error.textContent = result.path ? "" : `撮れなかった：${result.error || "理由不明"}`;
  if (result.path) {
    photo.src = `/captures/${result.path.split("/").pop()}${token ? `?token=${encodeURIComponent(token)}` : ""}`;
    photo.alt = result.path;
    photo.hidden = false;
  }
});

document.getElementById("beat").addEventListener("click", () => api("/api/heartbeat", {}).then(refresh));

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
